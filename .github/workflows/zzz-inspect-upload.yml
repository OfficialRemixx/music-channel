# ONE-OFF READ-ONLY DIAGNOSTIC -- delete this file and
# scripts/zzz_inspect_upload.py once the question is answered.
# Changes nothing: only channels.list + videos.list.
name: zzz inspect upload

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube video id to inspect"
        required: false
        default: "ulnT75sM5Lc"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          INSPECT_VIDEO_ID: ${{ inputs.video_id }}
        run: python scripts/zzz_inspect_upload.py
