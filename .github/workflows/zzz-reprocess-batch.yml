# TEMPORARY one-off workflow (2026-10-19) -- runs scripts/reprocess_batch_5af4ce36.py
# once to redo the deep_focus-5af4ce36 batch now that the dedupe-threshold
# and storage-sync bugs are fixed. Delete this file once verified.
name: ZZZ reprocess batch 5af4ce36 (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/reprocess_batch_5af4ce36.py
