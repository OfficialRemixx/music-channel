# Section 6: cheap, frequent poll for a pending Kaggle job. Exits in seconds
# when nothing is pending. STUB until P1.
name: A2 collect

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "*/30 * * * *"   # enable after P1 sign-off

permissions:
  contents: read

concurrency:
  group: a2-collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: echo "STUB -- nothing to collect yet (P1 not wired). See generate/kaggle_acestep.py"
