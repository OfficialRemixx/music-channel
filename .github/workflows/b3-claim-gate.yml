# Section 5.7/6: checks processed videos before their publish time. Cancels
# publishAt + alerts on rejection/claim/audit-lock. Real as of P3:
# scripts/b3_claim_gate.py.
name: B3 claim-gate
on:
  workflow_dispatch: {}
  schedule:
    # Enabled 2026-10-20 together with B's cron. Now that videos publish
    # without a human looking at them first, this is the thing standing
    # between a copyright claim and a public upload: it re-checks each
    # uploaded video and cancels its scheduled publish if YouTube reports
    # a claim or rejection. Every 4h comfortably beats the gap between a
    # B run (10:00 UTC) and its publish slot (13:00 UTC).
    - cron: "0 */4 * * *"
permissions:
  contents: write
concurrency:
  group: b3-claim-gate
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/b3_claim_gate.py
