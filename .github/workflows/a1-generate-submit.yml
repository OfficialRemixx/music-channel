# Section 6 / 5.2: Phase 1 of two-phase generation. Pushes a Kaggle notebook
# and returns immediately -- never holds a runner waiting on the GPU job.
# Real as of P1: scripts/a1_submit.py. Scheduled trigger enabled 2026-10-15
# after a verified real end-to-end run (mc-gen-deep-focus-f3911ae8 completed,
# 2/2 tracks passed QC).
name: A1 generate-submit

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1,4"   # ~2x/week

permissions:
  contents: write

concurrency:
  group: a1-generate-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/a1_submit.py
