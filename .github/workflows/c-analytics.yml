# Section 5.9/6: weekly Analytics pull -> weights.json + progress report.
name: C analytics
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 7 * * 1"
permissions:
  contents: read
concurrency:
  group: c-analytics
  cancel-in-progress: true
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -c "from analytics import weekly_report; print(weekly_report({'uploaded_videos':[]}))"
