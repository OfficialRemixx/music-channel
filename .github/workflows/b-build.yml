# Section 6: render + upload private, then wait at the approval Environment.
# Real as of P1/P2/P3: scripts/b_build.py (mix.py + visuals.py + upload.py).
name: B build

on:
  workflow_dispatch: {}
  # schedule: enable per cadence_ramp once a verified manual run uploads cleanly

permissions:
  contents: write

concurrency:
  group: b-build
  cancel-in-progress: false

jobs:
  approval-gate:
    runs-on: ubuntu-latest
    environment: production # Section 5.8: requires a human reviewer set up on this Environment
    timeout-minutes: 60
    steps:
      - run: echo "Reviewer approved -- proceeding to build+upload."

  build:
    needs: approval-gate
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6h job limit (Section 6)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - env:
          # b_build.py reads every track's audio back out of the private
          # Kaggle Dataset (storage.resolve_track_path), so it needs the
          # same Kaggle credentials A2/A1c use. These were missing: this
          # workflow still had the env list from when audio lived in git,
          # and the first real B run died instantly on
          # "KAGGLE_USERNAME is not set" before building anything.
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/b_build.py
