# Section 6: build the mix, render it, and upload it scheduled-public.
# Real as of P1/P2/P3: scripts/b_build.py (mix.py + visuals.py + upload.py).
#
# Fully automatic as of 2026-10-20, at the owner's request ("100% automation,
# a to z publish tak"), after a manual run uploaded cleanly end to end
# (video 9zXUG9tjWQA). Two deliberate changes went with that:
#
#   - The cron below is enabled, at the cadence_ramp's starting rate of
#     2 long videos/week. 10:00 UTC lands before the 13:00 UTC publish
#     slot, so a build goes out the same evening IST rather than waiting
#     a day.
#   - The approval-gate job is gone. It existed so a human saw every
#     video before it went public; with it in place nothing publishes
#     unattended, which is exactly what the owner asked to remove. The
#     remaining safety net is B3 (claim gate), now also on cron: it runs
#     every 4 hours and cancels a scheduled publish if YouTube reports a
#     copyright claim or rejection before the slot arrives.
name: B build

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 10 * * 2,6"   # 2x/week (Tue + Sat), per cadence_ramp

permissions:
  contents: write

concurrency:
  group: b-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6h job limit (Section 6)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - env:
          # b_build.py reads every track's audio back out of the private
          # Kaggle Dataset (storage.resolve_track_path), so it needs the
          # same Kaggle credentials A2/A1c use. These were missing: this
          # workflow still had the env list from when audio lived in git,
          # and the first real B run died instantly on
          # "KAGGLE_USERNAME is not set" before building anything.
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/b_build.py
