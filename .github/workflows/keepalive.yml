# Section 6: GitHub disables scheduled workflows on a repo with no activity
# for 60 days (verify current threshold). A tiny weekly commit on a dedicated
# branch keeps the repo "active" without touching main.
name: keepalive

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: keepalive
      - run: |
          git config user.name "keepalive-bot"
          git config user.email "noreply@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git add .keepalive
          git commit -m "keepalive" --allow-empty
          git push
