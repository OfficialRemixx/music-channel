# A1c: second, independent track source (real CC0/CC-BY tracks pooled
# from Jamendo + Freesound + Openverse, bass-boosted) -- runs alongside
# A1/A2's AI generation, equal weight, no Kaggle GPU cost so it can run
# more often to increase total output. Jamendo needs JAMENDO_CLIENT_ID
# (free signup at https://devportal.jamendo.com), Freesound needs
# FREESOUND_API_KEY (free signup at https://freesound.org/apiv2/apply),
# and Openverse needs OPENVERSE_CLIENT_ID + OPENVERSE_CLIENT_SECRET
# (registered once through its own API). Any subset of these can be
# missing -- each source is independently skipped if its secret isn't
# set, never a hard failure for the whole run.
name: A1c cc-library ingest

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 9 * * 1,3,5"   # 3x/week

permissions:
  contents: write

concurrency:
  group: a1c-cc-ingest
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    # 15 was too tight once tracks got longer: a real run was cancelled
    # mid-ingest at exactly 15m. The per-batch cap and the tighter source
    # duration ceiling should bring this well under 10m again, but the
    # job downloads and re-encodes ~26 tracks over the public internet,
    # so leave real headroom rather than losing an entire run to a slow
    # upstream.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          OPENVERSE_CLIENT_ID: ${{ secrets.OPENVERSE_CLIENT_ID }}
          OPENVERSE_CLIENT_SECRET: ${{ secrets.OPENVERSE_CLIENT_SECRET }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/a1c_cc_ingest.py
