pipeline_enabled: true
budget_mode: free
dry_run: false   # flipped on 2026-10-14: real Kaggle generation + real private YouTube uploads now live

niche:
  lane: deep_focus
  series: "Deep Focus"
  language: en

public_text:
  ai_wording: none
  description_disclosure_line: false

# Declarative only -- no code reads this; the real cadence is the cron in
# b-build.yml, now daily at the owner's request ("roz minimum 1 song").
# Shorts are NOT built: there is no shorts workflow, so shorts_per_week
# has never produced anything.
cadence_ramp:
  - { weeks: 52, long_per_week: 7, shorts_per_week: 0 }

publish_slots_utc: ["13:00", "00:00"]

music:
  provider: kaggle_acestep
  fallback: cc_library
  # Wired for real as of 2026-10-15 (was dead config before -- a1_submit.py
  # used to hardcode len(prompts)=2 from trend.py's fixed fallback matrix
  # regardless of this number). 26 = a light oversample above mix.tracks'
  # floor of 20, so normal QC/dedupe attrition still clears the minimum a
  # mix needs from a single batch. Real benchmark (2026-10-15,
  # mc-gen-deep-focus-f3911ae8, cpu_offload=True on a T4): ~4.5 min/track,
  # so 26 tracks/batch x 2 batches/week ~= 234 min/week of the 600 min/week
  # (10hr) budget below -- comfortable headroom for retries.
  tracks_per_batch: 26
  trend_share: 0.5          # fraction of a batch's prompts that get a trending word mixed in
  fixed_share: 0.5          # fraction that stay on evergreen genre/mood/instrument combos
  keep_ratio: 0.33          # NOT YET enforced anywhere in code -- see system-overview doc
  # 2 as of 2026-10-20, for daily publishing. A mix eats 20-30 tracks and
  # the sources supply ~90/week, so at one-use-per-track a daily video
  # needs ~175 tracks/week -- roughly double what comes in. Allowing a
  # track into two different mixes closes that gap without padding the
  # catalogue with obscure material, which is what paging deeper into the
  # popularity ranking would have done. mix.py enforces this per mix.
  max_track_reuse: 2
  kaggle_hours_per_week_cap: 10
  # Real batch (2026-10-15) showed 0.92 was far too aggressive -- the chroma
  # fingerprint mostly encodes key/instrumentation, so different tracks in
  # the same key routinely scored 0.92-0.98 and got wrongly rejected as
  # "duplicates" (18/26 tracks). Raised to only catch near-identical
  # renders -- see qc.py's MAX_DEDUPE_SIMILARITY comment for the full story.
  dedupe_similarity_max: 0.995  # cross-track chroma-fingerprint cosine similarity reject threshold (qc.py)

  # Added 2026-10-19: second, independent track source -- real CC0/CC-BY
  # tracks pooled from THREE sources (Jamendo, Freesound, Openverse --
  # see generate/cc_library.py's module docstring), independent artists
  # who've explicitly licensed reuse+remixing, bass-boosted, run through
  # the same qc.py gate as everything else. Equal weight to kaggle_acestep
  # (same tracks_per_batch), and scheduled MORE often (3x/week vs A1's
  # 2x/week) since it has no Kaggle GPU-hour cost -- this is the "qty
  # badhao" lever. Each source needs its own secret and is skipped
  # (logged, not fatal) without it: Jamendo JAMENDO_CLIENT_ID, Freesound
  # FREESOUND_API_KEY, Openverse OPENVERSE_CLIENT_ID+_SECRET.
  # NOTE: `tags` is used whole by Jamendo (its fuzzytags param ORs terms),
  # but split into one-word queries by Freesound and Openverse, which
  # both AND multi-word queries -- verified on the live APIs 2026-10-19.
  cc_library:
    enabled: true  # 2026-10-19: JAMENDO_CLIENT_ID set as a repo secret -- Jamendo source now live.
                    # Freesound still needs FREESOUND_API_KEY; Openverse works with no key either way.
    tracks_per_batch: 26
    tags: "lofi chill ambient instrumental"
    # Daily cadence needs FRESH popular tracks every run, and paging
    # deeper is not the way to get them: verified live 2026-10-20 that
    # Jamendo's popularity ranking falls off a cliff -- offset 0 returns
    # tracks with 400k-900k listens, offset 78 returns 545 and 3,261. The
    # genuinely popular slice is only ~50 deep per query.
    #
    # So rotate the QUERY instead. Each tag has its own popular top-N, so
    # a different tag set each day keeps pulling from the top of a
    # different ranking rather than scraping the bottom of one. The run
    # picks tags_per_run of these based on the date (see
    # cc_library._rotating_tags), which also stops every run from
    # re-fetching the same tracks for dedupe to throw away.
    tag_pool:
      - lofi
      - chillhop
      - ambient
      - instrumental
      - chill
      - jazz
      - piano
      - study
      - sleep
      - relaxing
      - downtempo
      - beats
    tags_per_run: 4
    bass_boost_db: 6.0
    # Fraction of each batch turned into mashups (two tracks blended)
    # instead of plain bass-boosts. Only same-key / close-BPM pairs are
    # ever blended -- see remix.pair_for_mashup -- so the real number is
    # usually lower than this, and that's deliberate: a clashing blend
    # would pass QC (which checks level, not dissonance) and end up in a
    # published mix. 0 disables mashups entirely.
    mashup_share: 0.4
    # Both sources are asked for their most-played/most-downloaded tracks
    # first, so batches draw on what's genuinely popular inside these free
    # libraries rather than random uploads. Jamendo: order=popularity_month
    # (live check 2026-10-20 returned tracks with 400k-900k listens).
    # Freesound: sort=downloads_desc (4.8k-5.9k downloads vs ~400-800 on
    # the default ordering).

qc:
  pass_rate_alert_below: 0.5   # a batch's QC pass-rate below this pauses new A1 submissions (circuit breaker)

mix:
  tracks: [20, 30]
  minutes: [60, 120]
  crossfade_s: [6, 12]

# off as of 2026-10-20: the owner asked for end-to-end automation through
# publish, so there is no human approval step any more. B3's claim gate
# (now on a 4-hourly cron) is what still stands between a copyright claim
# and a live video.
# Quoted deliberately: bare `off` is a BOOLEAN in YAML, so this would load
# as False rather than the string this field is documented to take.
approval_mode: "off"   # required | veto_window | off
storage: kaggle_dataset    # gdrive | hf_dataset | kaggle_dataset -- real as of 2026-10-15, see storage.py

weights:
  min_videos: 5
  min_views: 500
  exploration_floor: 0.25

upgrade_level: L0
